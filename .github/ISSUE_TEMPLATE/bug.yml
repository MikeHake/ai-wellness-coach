name: Bug report
description: Something is not working as expected
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Browser, environment (local or deployed), logs, or the sentence that was mis-parsed.
