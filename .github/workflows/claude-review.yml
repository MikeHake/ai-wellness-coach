name: Claude review

# Advisory AI review. Not a required check: only CI gates merging.
on:
  pull_request:
    types: [opened, reopened, ready_for_review]

jobs:
  review:
    name: Claude review
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Review with Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request as a careful senior engineer on this project.

            1. Read CLAUDE.md first. Its architecture rules, code conventions, and
               writing style are the standards for this review.
            2. Find the linked issue (`Closes #N` in the PR description) with
               `gh issue view`. Its definition of done is the spec. Report anything
               missing, partial, or out of scope.
            3. Look for correctness bugs, missing or weak tests, security problems
               (especially per-user authorization and secrets), and anything that
               breaks the architecture rules.

            Post an inline comment for each specific problem, on the line it
            concerns. Then post one summary comment that lists what you checked
            and the findings by severity. If you find nothing worth changing, say
            so briefly. Do not approve or request changes; your review is advisory.
            Be specific and concise. Never use em dashes.
          claude_args: |
            --model claude-sonnet-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*)"
